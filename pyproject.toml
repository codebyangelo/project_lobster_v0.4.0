[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-lobster"
version = "1.0.0b1"
authors = [
  { name="Angelo Ayton" },
]
description = "Hybrid local heuristics + cached intelligence + AI escalation security boundary"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "python-dotenv",
    "rich"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
lobster = "lobster.cli:run"
lobster-proxy = "lobster.mcp_proxy:main"

[tool.setuptools]
packages = ["lobster"]
