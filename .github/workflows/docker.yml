name: Docker CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.12.5  # Lock buildkit version for reproducible provenance

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          load: true
          tags: project-lobster:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable provenance to allow loading into the local Docker daemon
          provenance: false

      - name: Inspect Final Image Filesystem (Forensics)
        run: |
          echo "==== PIP VENDOR DIRECTORY ===="
          docker run --rm project-lobster:latest ls -la /usr/local/lib/python3.11/site-packages/pip/_vendor/msgpack || echo "Not found"
          echo "==== ENSUREPIP DIRECTORY ===="
          docker run --rm project-lobster:latest ls -la /usr/local/lib/python3.11/ensurepip/_bundled/ || echo "Not found"
          echo "==== INSTALLED PACKAGES ===="
          docker run --rm project-lobster:latest pip list
        continue-on-error: true

      - name: Run Trivy (JSON Output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'project-lobster:latest'
          format: 'json'
          output: 'trivy-full.json'
          ignore-unfixed: false
          vuln-type: 'os,library'

      - name: Run Trivy (Table Output - Standard)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'project-lobster:latest'
          format: 'table'
          output: 'trivy-standard.txt'
          ignore-unfixed: false
          vuln-type: 'os,library'
          
      - name: Verify Digests
        run: |
          echo "Build Digest: ${{ steps.build.outputs.digest }}" > digest_verification.txt
          docker image inspect project-lobster:latest | grep -i Id >> digest_verification.txt

      - name: Upload Forensic Evidence
        uses: actions/upload-artifact@v4
        with:
          name: trivy-forensics
          path: |
            trivy-full.json
            trivy-standard.txt
            digest_verification.txt
